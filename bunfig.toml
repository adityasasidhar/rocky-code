# Registers the Solid JSX transform for .tsx files (Bun's default transform
# compiles JSX React-style, which silently breaks Solid reactivity).
preload = ["@opentui/solid/preload"]

# Keep test discovery inside our own tree: opencode/ is a vendored reference
# checkout whose test suite must not run (or fail) as ours.
[test]
root = "test"
# ./preload.ts isolates ROCKY_HOME so the suite never reads the developer's own
# ~/.config/rocky/config.json (see test/preload.ts).
preload = ["@opentui/solid/preload", "./test/preload.ts"]
